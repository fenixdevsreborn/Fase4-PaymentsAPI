version: '3.8'

services:
  rabbitmq-server:
    image: rabbitmq:3-management
    container_name: rabbitmq-cloudgames
    ports:
      - "5672:5672"   
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  payments-worker:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: ms-payments-worker
    environment:
      - RABBITMQ_HOST=rabbitmq-server
      - RABBITMQ_USERNAME=guest
      - RABBITMQ_PASSWORD=guest
    depends_on:
      rabbitmq-server:
        condition: service_healthy